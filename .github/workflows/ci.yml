name: Project CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify provider-free source
        shell: bash
        run: |
          if grep -RniE 'gemini|ai\.studio|@google/genai|GEMINI_API_KEY|google\.dev' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist .; then
            echo "Forbidden provider-specific references detected."
            exit 1
          fi
