name: Extract ZIP

on:
  push:
    paths:
      - "*.zip"

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o *.zip -d extracted

      - name: Remove ZIP
        run: |
          rm -f *.zip

      - name: Move extracted files
        run: |
          cp -r extracted/* .
          rm -rf extracted

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract uploaded ZIP"
          git push
